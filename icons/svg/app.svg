<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Sidestep: a path that steps around a wall and keeps going. Badge colour = state. Flat: one solid colour, no gradient. -->
  <rect x="8" y="8" width="240" height="240" rx="60" fill="#534FDE"/>
  <!-- dotted wall -->
  <path d="M155 150 V215" stroke="#CBCAF5" stroke-width="24" stroke-linecap="round" stroke-dasharray="0 32"/>
  <!-- the step around it -->
  <path d="M50 164 H74 C102 164 94 80 126 80 H182" fill="none" stroke="#fff" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M164 116 L200 80 L164 44" fill="none" stroke="#fff" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
